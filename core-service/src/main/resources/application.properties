server.port=8080
spring.application.name=ibvap-core-service

# Database Configuration (PostgreSQL by default, auto-creates/updates tables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ibvap}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ibvap}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ibvap_secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Management & Health Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.ibvap=INFO
logging.level.org.springframework=WARN
